<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2B1810">
  <title>Contrôle d'entrée</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/scan.css">
  <script src="js/config.js"></script>
</head>
<body>
  <main class="app">

    <!-- Connexion -->
    <section id="login" class="panel">
      <h1>Contrôle d'entrée</h1>
      <p class="lead">Entrez le code d'accès réservé à l'équipe d'accueil.</p>
      <form id="loginForm" autocomplete="off">
        <label for="pin">Code d'accès</label>
        <input id="pin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <button class="btn" type="submit">Commencer</button>
        <p id="loginErr" class="err" role="alert"></p>
      </form>
    </section>

    <!-- Scanner -->
    <section id="scanner" class="panel" hidden>
      <div class="bar">
        <p id="stat" class="stat">Arrivés : – / –</p>
        <button id="logout" class="link" type="button">Quitter</button>
      </div>
      <div id="reader" class="reader"></div>
      <p id="camErr" class="err" role="alert"></p>
      <button id="camBtn" class="btn btn--ghost" type="button" hidden>Activer la caméra</button>

      <form id="manual" class="manual" autocomplete="off">
        <label for="manualCode">Code saisi à la main</label>
        <div class="row">
          <input id="manualCode" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="12">
          <button class="btn" type="submit">Valider</button>
        </div>
      </form>

      <form id="search" class="manual" autocomplete="off">
        <label for="searchQ">Invité sans téléphone ? Chercher par nom</label>
        <input id="searchQ" type="search" autocomplete="off" spellcheck="false" placeholder="Tapez au moins 2 lettres">
        <ul id="found" class="found" aria-live="polite"></ul>
      </form>
    </section>
  </main>

  <!-- Résultat (plein écran) -->
  <div id="result" class="result" hidden role="alert" aria-live="assertive">
    <div class="result-inner">
      <p id="resTitle" class="res-title"></p>
      <p id="resName" class="res-name"></p>
      <p id="resMeta" class="res-meta"></p>
      <p id="resNote" class="res-note"></p>
      <button id="resNext" class="btn btn--light" type="button">Scanner le suivant</button>
    </div>
  </div>

  <script src="js/vendor/html5-qrcode.min.js"></script>
  <script src="js/scan.js"></script>
</body>
</html>
